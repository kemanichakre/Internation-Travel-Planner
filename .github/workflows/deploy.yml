name: Deploy Travel Planner to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Internation-Travel-Planner

            git pull origin main

            docker build -f dockerfile -t travell .

            docker stop travell-container || true
            docker rm travell-container || true

            docker run -d \
              --name travell-container \
              --network travel-network \
              -p 5000:5000 \
              -e DB_USER=postgres \
              -e DB_PASSWORD=postgres \
              -e DB_NAME=travel_planner \
              -e DB_HOST=travel-postgres \
              -e DB_PORT=5432 \
              travell:latest